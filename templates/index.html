<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 광고 AR 시스템</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <section id="up"></section>
    <section id="down"></section>
    <section id="left"></section>
    <section id="right"></section>

    <button id="toggle-debug" class="theme-toggle-btn">🔧 Debug</button>

    <div id="backend-loading" class="backend-loading-overlay">
        <div class="backend-loading-content">
            <div class="loading-spinner"></div>
            <h2 id="loading-title">OCR 모델 로딩중...</h2>
            <p id="loading-message">잠시만 기다려주세요</p>
            <div class="loading-progress">
                <div id="loading-progress-bar" class="progress-bar"></div>
            </div>
            <div class="loading-details">
                <div class="loading-step"><span class="step-icon" id="ocr-icon">⏳</span><span>OCR 엔진 초기화</span></div>
                <div class="loading-step"><span class="step-icon" id="aruco-icon">⏳</span><span>ArUco 마커 검출기</span></div>
                <div class="loading-step"><span class="step-icon" id="personalization-icon">⏳</span><span>개인화 엔진</span></div>
            </div>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <h1>세상 모든 오프라인 광고를 <br>나에게 맞게.</h1>
        </header>

        <div class="top-controls">
            <div id="persona-display" class="persona-display">
                <div class="persona-info">
                    <span class="persona-label">현재 페르소나</span>
                    <span id="persona-name" class="persona-name">로딩 중...</span>
                </div>
                <a href="/admin" class="admin-link">⚙️ 설정</a>
            </div>

            <div class="control-panel">
                <div class="camera-selector">
                    <label for="camera-select" style="display:none;">카메라 선택:</label>
                    <select id="camera-select" class="camera-dropdown">
                        <option value="">카메라 선택...</option>
                    </select>
                </div>

                <button id="start-btn" class="btn btn-primary">시작</button>
                <button id="stop-btn" class="btn btn-secondary" disabled>중지</button>
                <button id="toggle-ocr" class="btn btn-toggle" style="display: none;">OCR</button>
                <button id="clear-btn" class="btn btn-secondary" style="display: none;">초기화</button>
                
                <div class="stats" style="display: none;">
                    <span id="fps">0</span> FPS
                </div>
            </div>
        </div>

        <div class="video-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div id="overlay-layer" class="overlay-layer"></div>
            <div id="loading" class="loading-indicator">
                <div class="spinner"></div>
                <p>OCR 처리 중...</p>
            </div>
        </div>

        <div class="debug-panel" id="debug-panel" style="display: none;">
            <h3>🔍 디버그 정보</h3>
            <div id="debug-info"><p>준비 중...</p></div>
            <h3>📋 OCR 결과</h3>
            <div id="ocr-results"><p>텍스트 인식 대기 중...</p></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/vanilla-tilt.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        // 디버그 모드 토글 및 스크롤 제어
        document.getElementById('toggle-debug').addEventListener('click', () => {
            const debugPanel = document.getElementById('debug-panel');
            const toggleBtn = document.getElementById('toggle-debug');
            const body = document.body;

            if (debugPanel.style.display === 'none') {
                // 디버그 모드 켜기
                debugPanel.style.display = 'block';
                toggleBtn.textContent = '🔧 Hide';
                
                // 스크롤 활성화
                body.classList.add('debug-active');
                
                // 패널로 부드럽게 스크롤 이동
                setTimeout(() => {
                    debugPanel.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            } else {
                // 디버그 모드 끄기
                debugPanel.style.display = 'none';
                toggleBtn.textContent = '🔧 Debug';
                
                // 스크롤 비활성화 (최상단으로 이동 후 잠금)
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    body.classList.remove('debug-active');
                }, 500); // 스크롤 애니메이션 시간 고려
            }
        });
    </script>
</body>
</html>
